<svg xmlns="http://www.w3.org/2000/svg" width="412" height="134" viewBox="0 0 412 134" fill="none">
  <title>Lattice Semiconductor Applications — Public GitHub Organization</title>
  <defs>
    <linearGradient id="viBtn" x1="0" y1="0" x2="180" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B348A"/>
      <stop offset="100%" stop-color="#7C4BB5"/>
    </linearGradient>
    <linearGradient id="viBar" x1="0" y1="0" x2="412" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="c1"><rect width="412" height="134" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c1)">
    <rect width="412" height="134" fill="#FFFFFF"/>
    <rect width="412" height="3.5" fill="url(#viBar)"/>
  </g>
  <rect x="0.75" y="0.75" width="410.5" height="132.5" rx="11.25" stroke="#C4B5FD" stroke-width="1.2"/>

  <!-- Globe Icon Tile -->
  <rect x="20" y="22" width="46" height="46" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-opacity="0.45" stroke-width="1"/>
  <g transform="translate(31, 33)" stroke="#6D28D9" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <ellipse cx="12" cy="12" rx="4" ry="9"/>
    <path d="M3 12h18"/>
  </g>

  <!-- Text Lockup -->
  <text x="80" y="34" fill="#6D28D9" font-family="'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">PUBLIC GITHUB ORGANIZATION</text>
  <text x="80" y="54" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Lattice Semiconductor Applications</text>
  <text x="80" y="73" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Public examples, applications &amp; documentation</text>

  <!-- Signature Purple CTA Pill -->
  <rect x="20" y="88" width="218" height="30" rx="7" fill="url(#viBtn)"/>
  <text x="34" y="107" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="600">Browse public organization</text>
  <path d="M220 99l4 4-4 4" stroke="#FFFFFF" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
</svg>